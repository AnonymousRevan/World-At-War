 ss_recruitment_event.10.t:0 "Generals protest"
 ss_recruitment_event.10.desc:0 "In a meeting with [GER.GetLeader] today, a number of high-ranking Wehrmacht officers in the Oberkommando der Wehrmacht have voiced their concerns about what they term "political favouritism" on the behalf of the Saal-Schutz. In particular, they are watching the development of a parallel armed force in the Waffen-Saal-Schutz with deep worry. \n\nThe lavishly equipped Saal-Schutz-Divisions, their argument continues, only take away desperately needed resources from the regular military. \n\nFinally, independent recruitment could lead to separate command structures, leading to a separation of efforts when all force needs to be bundled to achieve final victory."
 ss_recruitment_event.10.a:0 "This interference in political matters is unbecoming of German officers."
 ss_recruitment_event.10.b:0 "Assure them that the OKW has final command of all Saal-Schutz forces."

 SS_recruitment_tt:1 "The Saal-Schutz under Himmler believes that they should be in charge of recruiting large amounts of foreign volunteers for the fight against global bolshevism. The Wehrmacht strongly disagrees and will not tolerate a parrallel command structure. Pushing either of them too far may have grave consequences.\n\nCurrent §YMood§! in the OKW: [Root.GetWehrmachtAngerLevel] ([?GER.wehrmacht_anger|-0])\n\nCurrent §YMood§! in the Saal-Schutz Leadership: [Root.GetSSAngerLevel] ([?GER.SS_anger|-0])\n\nWill allow the [Root.GetName] the §Ydecisions§! to recruit foreign volunteers from occupied countries, as well as Germany."
 SS_recruitment_tt_2:1 "The Saal-Schutz under Himmler believes that they should be in charge of recruiting a small German elite force for the fight against global bolshevism. The Wehrmacht strongly disagrees and will not tolerate a parrallel command structure. Pushing either of them too far may have grave consequences.\n\nCurrent §YMood§! in the OKW: [Root.GetWehrmachtAngerLevel] ([?GER.wehrmacht_anger|-0])\n\nCurrent §YMood§! in the Saal-Schutz Leadership: [Root.GetSSAngerLevel] ([?GER.SS_anger|-0])\n\nWill allow the [Root.GetName] the §Ydecisions§! to recruit Saal-Schutz divisions from German volunteers."
